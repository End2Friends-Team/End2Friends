{% extends 'base.html' %}
{% block title %}Create Room{% endblock %}
{% block content %}

<main class="flex-1 p-8" style="background: var(--bg-page);">
    <div class="max-w-xl mx-auto">
        <!-- Header with Icon -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl flex items-center justify-center" style="background: var(--accent-light);">
                <span class="material-symbols-outlined text-3xl" style="color: var(--accent);">add_circle</span>
            </div>
            <h1 class="text-2xl font-bold t-text-primary">Create a New Room</h1>
            <p class="t-text-secondary mt-2">Set up a space for your team to collaborate</p>
        </div>

        <!-- Create Room Card -->
        <div class="t-card p-8">
            <form method="post" class="space-y-6">
                {% csrf_token %}

                <!-- Room Name -->
                <div>
                    <label for="id_name" class="block text-sm font-medium t-text-secondary mb-2">
                        <span class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-base" style="color: var(--accent);">tag</span>
                            Room Name
                        </span>
                    </label>
                    <input type="text" name="name" id="id_name" required class="t-input text-base"
                        placeholder="e.g. Study Group">
                </div>

                <!-- Room Type -->
                <div>
                    <label for="id_room_type" class="block text-sm font-medium t-text-secondary mb-2">
                        <span class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-base" style="color: var(--accent);">category</span>
                            Room Type
                        </span>
                    </label>
                    <select name="room_type" id="id_room_type" class="t-input text-base cursor-pointer">
                        <option value="study">📚 Study</option>
                        <option value="class">🎓 Class</option>
                        <option value="group">👥 Group</option>
                    </select>
                </div>

                <!-- Description -->
                <div>
                    <label for="id_description" class="block text-sm font-medium t-text-secondary mb-2">
                        <span class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-base" style="color: var(--accent);">description</span>
                            Description <span class="t-text-muted font-normal">(optional)</span>
                        </span>
                    </label>
                    <textarea name="description" id="id_description" rows="3" class="t-input resize-none"
                        placeholder="What's this room about?"></textarea>
                </div>

                <!-- Private Toggle -->
                <div class="p-4 rounded-xl" style="background: var(--bg-item); border: 1px solid var(--border-card);">
                    <label for="id_is_private" class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" name="is_private" id="id_is_private"
                            class="w-5 h-5 rounded" style="accent-color: var(--accent);">
                        <div>
                            <p class="t-text-primary font-medium">Private Room</p>
                            <p class="text-xs t-text-muted">Only invited members can join</p>
                        </div>
                        <span class="material-symbols-outlined ml-auto t-text-muted">lock</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="t-btn-primary w-full py-3 text-base font-medium flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined">add</span>
                    Create Room
                </button>
            </form>

            <!-- Back Link -->
            <div class="text-center mt-6 pt-6" style="border-top: 1px solid var(--border-card);">
                <a href="{% url 'dashboard' %}" class="inline-flex items-center gap-1 t-text-accent hover:underline text-sm font-medium">
                    <span class="material-symbols-outlined text-sm">arrow_back</span>
                    Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</main>

{% endblock %}
