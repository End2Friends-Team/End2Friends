<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>End2Friend</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <style>
        :root {
            --accent: #585aa1;
            --accent-hover: #4d508e;
            --accent-light: #e8e7dc;
        }

        body {
            font-family: "Varela Round", sans-serif;
            margin: 0;
            overflow: hidden;
        }

        .auth-bg {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e8e7dc 0%, #d4d3f5 50%, #c9c8e8 100%);
            position: relative;
            padding: 20px;
        }

        .auth-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(88, 90, 161, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(114, 117, 184, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .auth-logo {
            color: #585aa1;
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            animation: float 5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(88, 90, 161, 0.15);
            box-shadow: 
                0 20px 40px rgba(88, 90, 161, 0.12),
                0 0 0 1px rgba(255, 255, 255, 0.8);
            animation: fadeIn 0.6s ease forwards;
            opacity: 0;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
            from { opacity: 0; transform: translateY(15px); }
        }

        .auth-card h1 {
            color: #1f2937;
        }

        .auth-card p {
            color: #6b7280;
        }

        .auth-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            background: #f8f8fc;
            border: 1px solid #e5e5ef;
            color: #1f2937;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .auth-input::placeholder {
            color: #9ca3af;
        }

        .auth-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 90, 161, 0.15);
            background: #fff;
        }

        .auth-label {
            color: #4b5563;
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: 600;
            display: block;
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent) 0%, #7275b8 100%);
            color: white;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(88, 90, 161, 0.3);
        }

        .auth-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
        }

        .auth-footer a {
            color: var(--accent);
            font-weight: 600;
            transition: color 0.2s;
        }

        .auth-footer a:hover {
            color: var(--accent-hover);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="auth-bg">
        <div class="flex flex-col items-center">

            <div class="auth-logo">
                <span class="material-symbols-outlined">drone_2</span>
                End2Friend
            </div>

            <div class="auth-card">
                <h1 class="text-center text-xl font-bold mb-1">Welcome back!</h1>
                <p class="text-center text-sm mb-6">Enter your details to access your account.</p>

                <form class="flex flex-col gap-4" method="post">
                    {% csrf_token %}

                    {% if form.non_field_errors %}
                    <div class="auth-error">
                        <span class="material-symbols-outlined" style="font-size:18px;">error</span>
                        {{ form.non_field_errors }}
                    </div>
                    {% endif %}

                    <div>
                        <label class="auth-label">Username</label>
                        <input class="auth-input {% if form.username.errors %}border-red-400{% endif %}"
                               type="text" name="username"
                               value="{{ form.username.value|default_if_none:'' }}"
                               placeholder="Enter your username" required>
                    </div>

                    <div>
                        <label class="auth-label">Password</label>
                        <input class="auth-input {% if form.password.errors %}border-red-400{% endif %}"
                               type="password" name="password"
                               placeholder="Enter your password" required>
                    </div>

                    <button class="auth-btn" type="submit">Sign in</button>
                </form>

                <div class="auth-footer">
                    Don't have an account? <a href="{% url 'register' %}">Sign up</a>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
